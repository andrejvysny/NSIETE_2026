[project]
name = "flickr30k-text-retrieval"
version = "0.2.0"
description = "Text-to-image retrieval system using CLIP on Flickr30k"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.36",
    "datasets>=2.16",
    "Pillow>=10.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
    "jupyter>=1.0",
    "ipywidgets>=8.1",
    "python-dotenv>=1.2.2",
    "peft>=0.7",
    "pandas>=2.1",
    "wandb>=0.16",
]

[project.optional-dependencies]
dev = ["ruff>=0.1", "mypy>=1.8"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length is enforced by ruff format
    "B008",  # ok to use function calls in default arg defaults (e.g. Path)
    "UP007", # keep Optional[X] over X | None for clarity in older PyTorch idioms
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["F401", "F841", "E402"]
